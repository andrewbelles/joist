[project]
name = "joist-research"
version = "0.0.0"
description = "Offline metric evaluation harness. Never shipped, never a runtime dependency."
requires-python = ">=3.11"
dependencies = [
    "networkit>=11.0",
    "numpy>=1.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["joist_research"]
